<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Gerador de Link</title>
  <style>
    body {
      background:#000;
      color:#fff;
      font-family:Arial, sans-serif;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
      margin:0;
    }
    .box {
      width:320px;
      display:flex;
      flex-direction:column;
      gap:10px;
    }
    input, button {
      padding:10px;
      border:none;
      border-radius:6px;
    }
    button {
      background:#1d9bf0;
      color:#fff;
      cursor:pointer;
    }
  </style>
</head>
<body>

<div class="box">
  <h2>Gerar Link</h2>

  <input id="destino" placeholder="Link de destino">
  <input id="media" placeholder="Link Cloudinary (imagem ou vídeo)">

  <button onclick="gerar()">Gerar link</button>

  <input id="resultado" placeholder="Link final" readonly>
</div>

<script>
function gerar() {
  const destino = encodeURIComponent(document.getElementById('destino').value);
  const media = encodeURIComponent(document.getElementById('media').value);

  const link = `${location.origin}/preview.html?go=${destino}&media=${media}`;
  document.getElementById('resultado').value = link;
}
</script>

</body>
</html>

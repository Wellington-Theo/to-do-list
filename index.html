<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lista Minimalista</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="app__header">
        <h1>Lista de Tarefas</h1>
        <p>Registre apenas o essencial para o seu dia.</p>
      </header>

      <form id="task-form" class="task-form" aria-label="Adicionar tarefa">
        <label class="sr-only" for="task-input">Descrição da tarefa</label>
        <input
          id="task-input"
          name="task"
          type="text"
          placeholder="O que precisa ser feito?"
          autocomplete="off"
          required
        />
        <button type="submit" class="task-form__submit">Adicionar</button>
      </form>

      <section aria-live="polite">
        <ul id="task-list" class="task-list"></ul>
        <p id="empty-state" class="empty-state">Nenhuma tarefa por aqui.</p>
      </section>

      <footer class="app__footer" aria-live="polite">
        <span id="task-counter">0 tarefas</span>
        <button type="button" id="clear-completed" class="link-button">
          Limpar concluídas
        </button>
      </footer>
    </main>

    <template id="task-template">
      <li class="task">
        <label class="task__label">
          <input type="checkbox" class="task__checkbox" />
          <span class="task__text"></span>
        </label>
        <button class="task__delete" type="button" aria-label="Remover tarefa">×</button>
      </li>
    </template>

    <script src="app.js"></script>
  </body>
</html>
